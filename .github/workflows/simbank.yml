name: 模拟投注
# 北京时间 10:40 / 11:45 / 14:20 / 18:50（UTC 02:40 / 03:45 / 06:20 / 10:50）
on:
  schedule:
    - cron: "40 2 * * *"
    - cron: "45 3 * * *"
    - cron: "20 6 * * *"
    - cron: "50 10 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: jczq-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pipeline
        with:
          mode: simbank

name: 模拟投注
# 北京时间 11:00 / 12:20 / 15:00 / 19:20（UTC 03:00 / 04:20 / 07:00 / 11:20）
# 比原来的 10:40 起跑晚：等 赛果核对（09:10/09:50/10:30）先补齐昨晚跨零点场次，
# 也让本机 12:30 的拉取能追上本次回写。最早的竞彩开赛在 13:00 左右，11:00 仍是满盘。
on:
  schedule:
    - cron: "0 3 * * *"
    - cron: "20 4 * * *"
    - cron: "0 7 * * *"
    - cron: "20 11 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: jczq-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pipeline
        with:
          mode: simbank

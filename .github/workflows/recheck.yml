name: 临场复核
# 北京时间 15:20 / 16:10（UTC 07:20 / 08:10）
on:
  schedule:
    - cron: "20 7 * * *"
    - cron: "10 8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: jczq-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pipeline
        with:
          mode: recheck

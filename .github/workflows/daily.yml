name: 比分日报
# 北京时间 11:20 / 14:00 / 18:30（UTC 03:20 / 06:00 / 10:30）
on:
  schedule:
    - cron: "20 3 * * *"
    - cron: "0 6 * * *"
    - cron: "30 10 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: jczq-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pipeline
        with:
          mode: daily

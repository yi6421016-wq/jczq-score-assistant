name: 跑一条管线
description: 安装依赖、执行指定任务、回写状态、发布站点

inputs:
  mode:
    description: verify / recheck / daily / simbank / backtest
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip

    - name: 安装依赖
      shell: bash
      run: pip install -q -r requirements.txt

    - name: 同步到分支最新
      # 排在队列里的运行检出的是“触发那一刻”的提交，不是分支最新：不等步就开工，
      # 会拿隔夜台账开奖，回写时又跟别的运行抢同一批生成文件，冲突就出在这儿。
      shell: bash
      run: |
        git fetch -q origin main
        if git merge --ff-only -q origin/main; then
          echo "已快进到 $(git rev-parse --short origin/main)"
        else
          echo "检出提交与分支最新分叉，保留当前快照继续"
        fi

    - name: 执行任务
      shell: bash
      run: bash 云端流水线.sh "${{ inputs.mode }}"

    - name: 回写状态
      shell: bash
      run: |
        git config user.name "竞彩机器人"
        git config user.email "actions@users.noreply.github.com"
        git add -A
        if git diff --cached --quiet; then
          echo "状态无变化"
        else
          git commit -m "状态更新 $(date -u '+%F %H:%M UTC')"
          ok=0
          for i in 1 2 3 4 5; do
            opts=""
            if [ "$i" -ge 4 ]; then
              opts="-X theirs"
              echo "连续冲突，改为本次生成快照优先重试…"
            fi
            if git pull --rebase --autostash ${opts:+$opts} origin main && git push; then
              echo "回写成功（第 ${i} 次尝试）"
              ok=1
              break
            fi
            echo "第 ${i} 次回写失败，清理后重试…"
            git rebase --abort 2>/dev/null || true
            git merge --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          if [ "$ok" != "1" ]; then
            echo "回写失败：连续 5 次未能推送，请检查是否同文件并发写入冲突"
            git status --short
            exit 1
          fi
        fi

    - name: 打包站点
      uses: actions/upload-pages-artifact@v3
      with:
        path: 竞彩比分助手/手机版/site

    - name: 发布到 Pages
      uses: actions/deploy-pages@v4

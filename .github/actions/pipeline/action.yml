name: 跑一条管线
description: 安装依赖、执行指定任务、回写状态、发布站点

inputs:
  mode:
    description: verify / recheck / daily / simbank / backtest
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip

    - name: 安装依赖
      shell: bash
      run: pip install -q -r requirements.txt

    - name: 执行任务
      shell: bash
      run: bash 云端流水线.sh "${{ inputs.mode }}"

    - name: 回写状态
      shell: bash
      run: |
        git config user.name "竞彩机器人"
        git config user.email "actions@users.noreply.github.com"
        git add -A
        if git diff --cached --quiet; then
          echo "状态无变化"
        else
          git commit -m "状态更新 $(date -u '+%F %H:%M UTC')"
          git push
        fi

    - name: 打包站点
      uses: actions/upload-pages-artifact@v3
      with:
        path: 竞彩比分助手/手机版/site

    - name: 发布到 Pages
      uses: actions/deploy-pages@v4
